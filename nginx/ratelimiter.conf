# Include this from nginx.conf's http {} block, e.g. copy it to
# /opt/homebrew/etc/nginx/servers/ (Homebrew includes servers/* by default).

upstream ratelimiter {
    server unix:/tmp/ratelimiter.sock;
    keepalive 32;                    # idle connections kept per worker -> no reconnect per subrequest
}

server {
    listen 8080;

    # Trust X-Forwarded-For only from localhost (the load tester / a local LB):
    # $remote_addr - and so X-Real-IP sent to the limiter - becomes that IP.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;

    location / {
        auth_request /_ratelimit;    # subrequest; 2xx = allow, 401/403 = deny
        error_page 403 = @too_many;  # Go returns 403 for "rate limited"
        # Not "return 200" here: return runs in the rewrite phase, *before*
        # auth_request (access phase), so the limiter would never be called.
        # try_files runs after the access phase; the bogus path always misses
        # and falls through to @allowed.
        try_files /__nonexistent__ @allowed;   # replace with: proxy_pass http://your_backend;
    }

    location @allowed {
        return 200 "ok\n";
    }

    location = /_ratelimit {
        internal;                    # not reachable by clients directly
        proxy_pass http://ratelimiter/check;

        proxy_http_version 1.1;      # both needed for upstream keepalive
        proxy_set_header Connection "";

        proxy_pass_request_body off; # the limiter never needs the body
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Original-URI $request_uri;

        proxy_connect_timeout 50ms;
        proxy_read_timeout 100ms;
    }

    location @too_many {
        return 429 "rate limited\n";
    }
}
